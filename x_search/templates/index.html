{% extends 'base.html' %}

{% block content %}
<div class="home-container">
    <div class="logo">
        <span class="x">X</span>-Crop
    </div>
    <form action="/search" method="get" class="search-form">
        <div class="search-bar-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" name="q" placeholder="Search the web with AI..." required>
            <span class="mic-icon">🎤</span>
        </div>
        <div class="buttons">
            <button type="submit">X-Crop Search</button>
            <button type="button" onclick="window.location.href='/feeling-ai'">I'm Feeling AI</button>
        </div>
    </form>
</div>
{% endblock %}
